name: Tests and AppImage
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      XDG_CONFIG_HOME: /tmp/eds-renamer-test-config
      ER_PYTHON: python
      ER_BUILD_ROOT: /tmp/eds-renamer-release
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 binutils desktop-file-utils libglib2.0-bin xvfb xauth
      - name: Install pinned Python environment
        run: python -m pip install -r requirements-build.txt
      - name: Lint and validate packaging
        run: |
          ruff check .
          python -m pip check
          bash -n build.sh launch.sh packaging/appimage/build-appimage.sh
          desktop-file-validate packaging/appimage/filehash.desktop
      - name: Regression tests and GUI self-test
        run: |
          python -m pytest tests -q
          python renamer_gui.py --self-test
      - name: Build and verify AppImage (offscreen, X11, CLI)
        run: bash packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: EdsRenamer-Linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 30
